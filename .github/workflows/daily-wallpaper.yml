name: Generate daily wallpaper

on:
  schedule:
    # Runs at 06:00 UTC every day. Adjust to whenever your "new day" should
    # roll over — e.g. shortly after your local midnight. UTC 06:00 is
    # ~01:00-02:00 US Eastern, ~22:00-23:00 US Pacific (previous day), etc.
    # Tune the cron for your own timezone (GitHub Actions cron is UTC only).
    - cron: '0 6 * * *'
  workflow_dispatch: {} # allows manual "Run workflow" trigger from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate today's wallpaper
        run: npm run generate

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
